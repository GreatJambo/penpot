# Mounted into the frontend image at
# /etc/nginx/overrides/server.d/presenter.conf
# The 2.18.5 image includes that directory from the server block.
# ^~ wins over the nested catch-all that would otherwise 404 this path.
# A variable proxy_pass uses the image resolver, so a recreated
# sidecar gets a fresh address. The browser calls Penpot on this
# same origin, so the session cookie and a Cloudflare Access cookie
# are sent with no extra hostname.

location = /presenter {
    return 302 /presenter/;
}

location ^~ /presenter/ {
    set $presenter_backend penpot-presenter:8080;
    rewrite ^/presenter/?(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$presenter_backend;
}
