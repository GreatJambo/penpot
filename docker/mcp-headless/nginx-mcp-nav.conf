# Mounted into the frontend image at
# /etc/nginx/overrides/server.d/mcp-nav.conf
# The 2.18.5 image includes that directory from the server block.
# access_log is off so the userToken query string is not written.

location /mcp-nav/stream {
    access_log off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    set $mcp_nav_backend http://penpot-mcp-headless:4410/mcp$is_args$args;
    proxy_pass $mcp_nav_backend;
}
